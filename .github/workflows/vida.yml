# La vida de Valdecerro sigue aunque nadie mire: cada pocas horas un runner abre la simulación
# sin pantalla, pone al día el tiempo transcurrido y guarda el nuevo estado en estado/partida.json.
# El visor publicado en GitHub Pages lee ese archivo al arrancar.
name: Vida de Valdecerro

on:
  schedule:
    - cron: '0 */2 * * *'   # cada 2 horas, en UTC; GitHub puede retrasarlo unos minutos
  workflow_dispatch:
    inputs:
      nueva:
        description: 'Empezar un pueblo nuevo (descarta el estado actual)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vida-valdecerro
  cancel-in-progress: false

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Simular el tiempo transcurrido
        run: node servidor/tick.mjs ${{ inputs.nueva == true && '--nueva' || '' }}

      - name: Guardar el nuevo estado en el repositorio
        run: |
          git config user.name "Valdecerro"
          git config user.email "valdecerro@users.noreply.github.com"
          git add estado
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "$(cat estado/ultimo-latido.txt)"
          git pull --rebase
          git push
