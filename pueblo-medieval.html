<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pueblo Medieval Low-Poly</title>
<style>
  :root {
    --panel: #17202B;
    --ink: #EDE4D3;
    --ink-soft: rgba(237, 228, 211, 0.72);
    --brass: #C9A227;
    --radius: 6px;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #141B33;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  canvas { display: block; }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 272px;
    box-sizing: border-box;
    padding: 14px 16px 12px;
    background: rgba(23, 32, 43, 0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-top: 1px solid var(--brass);
    border-radius: var(--radius);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    font-size: 13px;
    line-height: 1.45;
    pointer-events: none;
    user-select: none;
  }
  #hud h1 {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .hud-clock {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .hud-time {
    font-size: 26px;
    font-weight: 700;
    color: var(--brass);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .hud-day { font-size: 13px; color: var(--ink-soft); }
  .hud-phase { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .hud-weather {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    margin-bottom: 10px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: var(--radius);
  }
  .hud-weather svg { width: 28px; height: 28px; flex: none; display: block; }
  .hud-weather-name { font-size: 15px; font-weight: 600; color: var(--brass); }
  .hud-weather-sub { font-size: 12px; color: var(--ink-soft); }
  .hud-stats {
    display: grid;
    grid-template-columns: 1fr auto;
    row-gap: 1px;
    column-gap: 12px;
    margin-bottom: 10px;
  }
  .hud-stats .k { color: var(--ink-soft); }
  .hud-stats .v { color: var(--brass); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .hud-stats .total { color: var(--ink); font-weight: 600; }
  .hud-log {
    border-top: 1px solid rgba(237, 228, 211, 0.12);
    padding-top: 8px;
    margin-bottom: 10px;
    min-height: 58px;
  }
  .hud-log p {
    margin: 0 0 4px;
    font-size: 12.5px;
    opacity: 1;
    transition: opacity 0.45s ease;
  }
  .hud-log p.fresh { opacity: 0; }
  .hud-log p:nth-child(2) { opacity: 0.75; }
  .hud-log p:nth-child(3) { opacity: 0.5; }
  .hud-log time { color: var(--brass); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .hud-controls {
    display: flex;
    gap: 6px;
    pointer-events: auto;
  }
  .hud-controls button {
    flex: 1;
    padding: 6px 8px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: rgba(237, 228, 211, 0.08);
    border: 1px solid rgba(237, 228, 211, 0.18);
    border-radius: var(--radius);
    cursor: pointer;
  }
  .hud-controls button:hover { background: rgba(237, 228, 211, 0.15); }
  .hud-controls button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  .hud-controls button.active { border-color: var(--brass); color: var(--brass); }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 15px;
    background: #141B33;
    z-index: 5;
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #note {
    position: fixed;
    right: 14px;
    bottom: 12px;
    font-size: 11.5px;
    color: rgba(237, 228, 211, 0.55);
    pointer-events: none;
  }
  @media (max-width: 640px) {
    #hud {
      top: 8px;
      left: 8px;
      width: 200px;
      padding: 10px 12px 10px;
      font-size: 12px;
    }
    #hud h1 { display: none; }
    .hud-time { font-size: 20px; }
    .hud-phase { margin-bottom: 6px; }
    .hud-weather { padding: 6px 8px; margin-bottom: 6px; }
    .hud-weather svg { width: 22px; height: 22px; }
    .hud-stats { margin-bottom: 6px; }
    .hud-stats .optional { display: none; }
    .hud-log { min-height: 0; margin-bottom: 6px; }
    .hud-log p:nth-child(n+3) { display: none; }
    .hud-controls button { padding: 5px 4px; font-size: 11.5px; }
    #note { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.168.0/build/three.module.js",

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- CONFIG
const CONFIG = {
  seed: null,
  map: { size: 200, segments: 120, hillAmplitude: 3.0, noiseScale: 0.03 },
  dayLengthSeconds: 240,
  startHour: 6.5,
  agents: { agricultor: 5, comerciante: 3, minero: 3, aldeano: 6, clerigo: 1, guardia: 2 },
  followers: { parejas: 1, ninos: 1 },
  travelers: { max: 2, chancePerMinute: 0.7, stayMin: 35, stayMax: 80 },
  animals: { gallinas: 7, cerdos: 5, wanderRadius: 6, speed: 1.1, peckMin: 1.2, peckMax: 3.2, rainRadius: 2.2 },
  speed: { walk: 3.4, guard: 2.9, traveler: 3.0, cart: 2.8, wander: 1.5, turnRate: 7 },
  social: { distance: 3, checkEveryFrames: 3, durMin: 1.5, durMax: 3.5, cooldownMin: 20, cooldownMax: 40, personalCooldown: 8 },
  activity: { minStay: 10, maxStay: 26, wanderRadius: 3.2, idleMin: 2, idleMax: 5 },
  weather: {
    minDuration: 45, maxDuration: 120, transitionSeconds: 4,
    transitions: {
      SOLEADO:  { SOLEADO: 0.30, NUBLADO: 0.45, FRIO: 0.25, LLUVIA: 0.00, TORMENTA: 0.00 },
      NUBLADO:  { SOLEADO: 0.35, NUBLADO: 0.05, FRIO: 0.15, LLUVIA: 0.30, TORMENTA: 0.15 },
      FRIO:     { SOLEADO: 0.30, NUBLADO: 0.40, FRIO: 0.05, LLUVIA: 0.25, TORMENTA: 0.00 },
      LLUVIA:   { SOLEADO: 0.20, NUBLADO: 0.40, FRIO: 0.10, LLUVIA: 0.05, TORMENTA: 0.25 },
      TORMENTA: { SOLEADO: 0.10, NUBLADO: 0.45, FRIO: 0.10, LLUVIA: 0.35, TORMENTA: 0.00 }
    },
    rainDrops: 2200, stormDrops: 4500, maxDrops: 4500,
    rainAreaHalf: 75, rainHeight: 45, rainSpeed: 28,
    lightningChancePerSecond: 0.22
  },
  events: {
    minInterval: 60, maxInterval: 150, firstDelay: 35,
    weights: { feria: 3, misa: 2, caravana: 2, mina: 2, mercado: 2 },
    feria: { min: 40, max: 80 },
    misa: { duration: 45 },
    caravana: { min: 2, max: 3, stayMin: 40, stayMax: 70 },
    mina: { duration: 50, productionPerSecond: 0.35 },
    mercado: { duration: 60 }
  },
  road: { width: 3.2, blend: 2.4, sampleSpacing: 1.0, wobbleMin: 4, wobbleMax: 9 },
  vegetation: { trees: 150, rocks: 75, bushes: 80 },
  camera: { autoRotateSpeed: 0.4, resumeAfter: 5, minDistance: 25, maxDistance: 170, startDistance: 90 },
  shadow: { mapSize: 2048, extent: 78 },
  hudRefresh: 0.25,
  maxDelta: 0.05
};

// ---------------------------------------------------------------- Utilidades y RNG
// mulberry32: RNG de 32 bits sembrado; toda la aleatoriedad de la simulación pasa por aquí.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Único uso de Math.random: elegir la semilla cuando CONFIG.seed es null.
const SEED = CONFIG.seed === null ? Math.floor(Math.random() * 2147483647) : CONFIG.seed;
const rng = mulberry32(SEED);
const rand = (a, b) => a + rng() * (b - a);
const randInt = (a, b) => Math.floor(a + rng() * (b - a + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const chance = (p) => rng() < p;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
function angleDelta(from, to) {
  let d = (to - from) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function weightedPick(weights, exclude) {
  let total = 0;
  for (const k in weights) if (k !== exclude) total += weights[k];
  let r = rng() * total;
  for (const k in weights) {
    if (k === exclude) continue;
    r -= weights[k];
    if (r <= 0) return k;
  }
  for (const k in weights) if (k !== exclude) return k;
  return null;
}
function hex(h) { return new THREE.Color(h); }

// Temporales preasignados: nunca se crean vectores dentro del bucle de render.
const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _v3 = new THREE.Vector3();
const _c1 = new THREE.Color();
const _c2 = new THREE.Color();
const _c3 = new THREE.Color();
const _m4 = new THREE.Matrix4();
const _dummy = new THREE.Object3D();

const PALETTE = {
  grass: 0x6F9E5B, grassDark: 0x5E8A4C, grassLight: 0x7FAE68,
  dirt: 0xB08A5E, dirtDark: 0x9A7549,
  stone: 0x8E8B84, stoneDark: 0x6E6B66,
  thatch: 0xC9A45B, tile: 0x8C4A3B, wood: 0x6B4A32,
  water: 0x3E6F8E,
  leaf1: 0x3F7A4A, leaf2: 0x4F8C55, leaf3: 0x356B44,
  window: 0xFFC978
};
const SKY = { day: hex(0x9CC4E4), dawn: hex(0xF0B27A), dusk: hex(0xE2705A), night: hex(0x141B33) };

// ---------------------------------------------------------------- Ruido y terreno
// Ruido de valor: hash entero -> [0,1), interpolado con curva suave; tres octavas dan colinas blandas.
const NOISE_OFF = { x: rand(0, 5000), z: rand(0, 5000) };
function hash2(ix, iz) {
  let n = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function valueNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uz);
}
function fbm(x, z, octaves) {
  let sum = 0, amp = 1, freq = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += valueNoise(x * freq, z * freq) * amp;
    norm += amp;
    amp *= 0.5; freq *= 2.1;
  }
  return sum / norm;
}
function baseHeight(x, z) {
  const s = CONFIG.map.noiseScale;
  const n = fbm((x + NOISE_OFF.x) * s, (z + NOISE_OFF.z) * s, 3);
  return n * CONFIG.map.hillAmplitude;
}

const Terrain = {
  size: CONFIG.map.size,
  segs: CONFIG.map.segments,
  half: CONFIG.map.size / 2,
  step: CONFIG.map.size / CONFIG.map.segments,
  heights: new Float32Array((CONFIG.map.segments + 1) * (CONFIG.map.segments + 1)),
  mesh: null,
  footprints: []
};
// Altura exacta del campo ya aplanado, por interpolación bilineal de la rejilla que usa la malla.
function terrainHeight(x, z) {
  const n = Terrain.segs;
  const gx = clamp((x + Terrain.half) / Terrain.step, 0, n - 0.0001);
  const gz = clamp((z + Terrain.half) / Terrain.step, 0, n - 0.0001);
  const ix = Math.floor(gx), iz = Math.floor(gz);
  const fx = gx - ix, fz = gz - iz;
  const w = n + 1;
  const h00 = Terrain.heights[iz * w + ix], h10 = Terrain.heights[iz * w + ix + 1];
  const h01 = Terrain.heights[(iz + 1) * w + ix], h11 = Terrain.heights[(iz + 1) * w + ix + 1];
  return lerp(lerp(h00, h10, fx), lerp(h01, h11, fx), fz);
}
function addFootprint(x, z, radius, blend) {
  Terrain.footprints.push({ x, z, r: radius, blend: blend === undefined ? 3 : blend, h: baseHeight(x, z) });
}
// Rejilla de celdas para consultar el punto de camino más cercano sin recorrer todos los muestreos.
const RoadField = {
  cell: 8, buckets: new Map(),
  key(cx, cz) { return cx * 4096 + cz; },
  insert(p) {
    const k = this.key(Math.floor(p.x / this.cell), Math.floor(p.z / this.cell));
    let b = this.buckets.get(k);
    if (!b) { b = []; this.buckets.set(k, b); }
    b.push(p);
  },
  nearest(x, z, out) {
    const cx = Math.floor(x / this.cell), cz = Math.floor(z / this.cell);
    let best = Infinity, bestP = null;
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
      const b = this.buckets.get(this.key(cx + dx, cz + dz));
      if (!b) continue;
      for (let i = 0; i < b.length; i++) {
        const p = b[i];
        const d = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z);
        if (d < best) { best = d; bestP = p; }
      }
    }
    out.d = Math.sqrt(best); out.p = bestP;
    return out;
  }
};
const _near = { d: 0, p: null };
function buildTerrain(scene) {
  const n = Terrain.segs, w = n + 1, half = Terrain.half, step = Terrain.step;
  const geo = new THREE.PlaneGeometry(Terrain.size, Terrain.size, n, n);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const grass = hex(PALETTE.grass), grassD = hex(PALETTE.grassDark), grassL = hex(PALETTE.grassLight);
  const dirt = hex(PALETTE.dirt), dirtD = hex(PALETTE.dirtDark);
  const roadHalf = CONFIG.road.width * 0.5, roadBlend = CONFIG.road.blend;
  for (let iz = 0; iz < w; iz++) {
    for (let ix = 0; ix < w; ix++) {
      const i = iz * w + ix;
      const x = -half + ix * step, z = -half + iz * step;
      let h = baseHeight(x, z);
      // Aplanado bajo edificios y caminos: primero huellas, después la altura suavizada del camino.
      for (let f = 0; f < Terrain.footprints.length; f++) {
        const fp = Terrain.footprints[f];
        const d = Math.hypot(x - fp.x, z - fp.z);
        if (d < fp.r + fp.blend) h = lerp(fp.h, h, smoothstep(fp.r, fp.r + fp.blend, d));
      }
      RoadField.nearest(x, z, _near);
      let roadMix = 0;
      if (_near.p) {
        const wr = 1 - smoothstep(roadHalf, roadHalf + roadBlend, _near.d);
        h = lerp(h, _near.p.h, wr * 0.9);
        roadMix = 1 - smoothstep(roadHalf * 0.75, roadHalf + roadBlend * 0.55, _near.d);
      }
      Terrain.heights[i] = h;
      pos.setXYZ(i, x, h, z);
      const gn = fbm((x + 900) * 0.08, (z + 900) * 0.08, 2);
      if (gn < 0.42) _c1.lerpColors(grassD, grass, gn / 0.42); else _c1.lerpColors(grass, grassL, (gn - 0.42) / 0.58);
      const dn = valueNoise(x * 0.35, z * 0.35);
      _c2.lerpColors(dirt, dirtD, dn);
      _c1.lerp(_c2, roadMix);
      colors[i * 3] = _c1.r; colors[i * 3 + 1] = _c1.g; colors[i * 3 + 2] = _c1.b;
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95, metalness: 0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);
  Terrain.mesh = mesh;
}

// ---------------------------------------------------------------- Grafo de caminos
const NODE_DEFS = [
  { id: 'plaza', x: 0, z: 0, area: 8 },
  { id: 'mercado', x: 21, z: -9, area: 6 },
  { id: 'iglesia', x: -25, z: -17, area: 3 },
  { id: 'castillo', x: 3, z: -46, area: 4 },
  { id: 'casa1', x: 25, z: 22, area: 2.5 },
  { id: 'casa2', x: -22, z: 25, area: 2.5 },
  { id: 'casa3', x: -39, z: 3, area: 2.5 },
  { id: 'casa4', x: 36, z: 5, area: 2.5 },
  { id: 'mina', x: 58, z: -33, area: 4 },
  { id: 'taberna', x: -7, z: 27, area: 4 },
  { id: 'granja', x: -48, z: 42, area: 4 },
  { id: 'almacen', x: 38, z: -23, area: 3 },
  { id: 'norte', x: -6, z: -97, area: 0, edge: true, label: 'del norte' },
  { id: 'sur', x: 12, z: 97, area: 0, edge: true, label: 'del sur' },
  { id: 'este', x: 97, z: 9, area: 0, edge: true, label: 'del este' },
  { id: 'oeste', x: -97, z: -12, area: 0, edge: true, label: 'del oeste' }
];
const EDGE_DEFS = [
  ['plaza', 'mercado'], ['plaza', 'iglesia'], ['plaza', 'taberna'], ['plaza', 'castillo'],
  ['plaza', 'casa1'], ['plaza', 'casa2'], ['iglesia', 'casa3'], ['mercado', 'casa4'],
  ['mercado', 'almacen'], ['almacen', 'mina'], ['mina', 'este'], ['castillo', 'norte'],
  ['taberna', 'granja'], ['granja', 'oeste'], ['casa1', 'sur'], ['casa2', 'taberna'],
  ['casa3', 'granja'], ['casa4', 'este'], ['iglesia', 'castillo'], ['casa1', 'mercado']
];
const Graph = {
  nodes: [], index: {}, edges: [], poly: {}, dist: [], next: [],
  node(id) { return this.nodes[this.index[id]]; },
  build() {
    NODE_DEFS.forEach((d, i) => {
      const n = { id: d.id, x: d.x, z: d.z, area: d.area, edge: !!d.edge, label: d.label || '', pos: new THREE.Vector3(d.x, 0, d.z) };
      this.nodes.push(n); this.index[d.id] = i; this.poly[d.id] = {};
    });
    for (const [a, b] of EDGE_DEFS) {
      const A = this.node(a), B = this.node(b);
      const dx = B.x - A.x, dz = B.z - A.z;
      const len = Math.hypot(dx, dz);
      const nx = -dz / len, nz = dx / len;
      // Uno o dos puntos de control desplazados lateralmente: de ahí la curvatura irregular del camino.
      const ctrl = [new THREE.Vector3(A.x, 0, A.z)];
      const nCtrl = len > 45 ? 2 : 1;
      for (let i = 1; i <= nCtrl; i++) {
        const t = i / (nCtrl + 1);
        const off = rand(CONFIG.road.wobbleMin, CONFIG.road.wobbleMax) * (chance(0.5) ? 1 : -1) * Math.min(1, len / 40);
        ctrl.push(new THREE.Vector3(A.x + dx * t + nx * off, 0, A.z + dz * t + nz * off));
      }
      ctrl.push(new THREE.Vector3(B.x, 0, B.z));
      const curve = new THREE.CatmullRomCurve3(ctrl, false, 'centripetal');
      const count = Math.max(4, Math.ceil(curve.getLength() / CONFIG.road.sampleSpacing));
      const pts = curve.getSpacedPoints(count);
      const samples = pts.map(p => ({ x: p.x, z: p.z, h: baseHeight(p.x, p.z) }));
      // Suavizado de la altura a lo largo del camino para que no ondule con cada cresta del ruido.
      const raw = samples.map(s => s.h);
      for (let i = 0; i < samples.length; i++) {
        let sum = 0, cnt = 0;
        for (let k = -6; k <= 6; k++) { const j = i + k; if (j >= 0 && j < raw.length) { sum += raw[j]; cnt++; } }
        samples[i].h = sum / cnt;
      }
      samples.forEach(s => RoadField.insert(s));
      const fwd = samples.map(s => new THREE.Vector3(s.x, 0, s.z));
      const back = fwd.slice().reverse();
      let length = 0;
      for (let i = 1; i < fwd.length; i++) length += fwd[i].distanceTo(fwd[i - 1]);
      this.edges.push({ a, b, length, pts: fwd });
      this.poly[a][b] = fwd; this.poly[b][a] = back;
    }
    // Explanadas de plaza y mercado: se pintan de tierra y se aplanan como un camino ancho.
    for (const n of this.nodes) {
      if (n.area <= 0) continue;
      const h = baseHeight(n.x, n.z);
      const r = n.area;
      for (let x = -r; x <= r; x += 1.5) for (let z = -r; z <= r; z += 1.5) {
        if (x * x + z * z <= r * r) RoadField.insert({ x: n.x + x, z: n.z + z, h });
      }
      addFootprint(n.x, n.z, r, 4);
    }
    this.computeRoutes();
  },
  // Floyd-Warshall: con 16 nodos, la tabla completa se calcula una vez y la ruta es una consulta O(1).
  computeRoutes() {
    const n = this.nodes.length;
    const D = [], N = [];
    for (let i = 0; i < n; i++) {
      D.push(new Array(n).fill(Infinity)); N.push(new Array(n).fill(-1));
      D[i][i] = 0;
    }
    for (const e of this.edges) {
      const i = this.index[e.a], j = this.index[e.b];
      D[i][j] = e.length; D[j][i] = e.length; N[i][j] = j; N[j][i] = i;
    }
    for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (D[i][k] + D[k][j] < D[i][j]) { D[i][j] = D[i][k] + D[k][j]; N[i][j] = N[i][k]; }
    }
    this.dist = D; this.next = N;
  },
  routeDist(a, b) { return this.dist[this.index[a]][this.index[b]]; },
  route(a, b) {
    let i = this.index[a];
    const j = this.index[b];
    const out = [a];
    while (i !== j) {
      i = this.next[i][j];
      if (i < 0) break;
      out.push(this.nodes[i].id);
    }
    return out;
  },
  updateHeights() {
    for (const n of this.nodes) n.pos.y = terrainHeight(n.x, n.z);
    for (const e of this.edges) for (const p of e.pts) p.y = terrainHeight(p.x, p.z);
  }
};

// Toda la geometría estática se funde en una malla por material: decenas de edificios pasan a ~20 draw calls.
// Las partes animadas (campana) se marcan como dinámicas y se quedan en su grupo original.
function mergeStaticMeshes() {
  const buckets = new Map();
  const toRemove = [];
  scene.updateMatrixWorld(true);
  for (const group of scene.children) {
    if (!group.userData.static) continue;
    group.traverse(obj => {
      if (!obj.isMesh || obj.isInstancedMesh) return;
      let p = obj;
      while (p && p !== group) { if (p.userData.dynamic) return; p = p.parent; }
      const geo = (obj.geometry.index ? obj.geometry.toNonIndexed() : obj.geometry.clone()).applyMatrix4(obj.matrixWorld);
      const key = obj.material.uuid;
      let b = buckets.get(key);
      if (!b) { b = { material: obj.material, geos: [], castShadow: obj.castShadow }; buckets.set(key, b); }
      b.geos.push(geo);
      toRemove.push(obj);
    });
  }
  for (const obj of toRemove) obj.parent.remove(obj);
  for (const b of buckets.values()) {
    const merged = mergeGeometries(b.geos, false);
    for (const g of b.geos) g.dispose();
    const m = new THREE.Mesh(merged, b.material);
    m.castShadow = b.castShadow;
    m.receiveShadow = true;
    scene.add(m);
  }
}

function buildCrops() {

  }
  const crops = new THREE.InstancedMesh(Assets.geo.crop, Assets.mat.leaf2, total);

  for (const { f, nx, nz } of rows) {

function buildFences() {
  const segs = [];
  for (const f of World.fields) {
    const hw = f.w / 2 + 1, hd = f.d / 2 + 1;
    const corners = [[f.x - hw, f.z - hd], [f.x + hw, f.z - hd], [f.x + hw, f.z + hd], [f.x - hw, f.z + hd]];
    for (let i = 0; i < 4; i++) segs.push([corners[i], corners[(i + 1) % 4]]);
  }
  const c1 = Graph.node('casa1');
  segs.push([[c1.x + 1, c1.z + 11], [c1.x + 12, c1.z + 11]], [[c1.x + 12, c1.z + 11], [c1.x + 12, c1.z + 2]]);
  const c2 = Graph.node('casa2');
  segs.push([[c2.x - 15, c2.z - 3], [c2.x - 15, c2.z + 6]], [[c2.x - 15, c2.z + 6], [c2.x - 7, c2.z + 6]]);
  const posts = [], rails = [];
  for (const [a, b] of segs) {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(1, Math.round(len / 2.2));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      posts.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t)]);
      if (i < n) rails.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[0], b[0], t + 1 / n), lerp(a[1], b[1], t + 1 / n)]);
    }
  }
  const postMesh = new THREE.InstancedMesh(Assets.geo.box, Assets.mat.wood, posts.length);
  posts.forEach(([x, z], i) => {
    _dummy.position.set(x, terrainHeight(x, z) + 0.5, z);
    _dummy.rotation.set(0, 0, 0);
    _dummy.scale.set(0.18, 1.1, 0.18);
    _dummy.updateMatrix();
    postMesh.setMatrixAt(i, _dummy.matrix);
  });
  const railMesh = new THREE.InstancedMesh(Assets.geo.box, Assets.mat.wood, rails.length * 2);
  rails.forEach(([x1, z1, x2, z2], i) => {
    const len = Math.hypot(x2 - x1, z2 - z1);
    const mx = (x1 + x2) / 2, mz = (z1 + z2) / 2;
    const y = (terrainHeight(x1, z1) + terrainHeight(x2, z2)) / 2;
    const ry = Math.atan2(x2 - x1, z2 - z1);
    for (let k = 0; k < 2; k++) {
      _dummy.position.set(mx, y + 0.45 + k * 0.4, mz);
      _dummy.rotation.set(0, ry, 0);
      _dummy.scale.set(0.08, 0.12, len);
      _dummy.updateMatrix();
      railMesh.setMatrixAt(i * 2 + k, _dummy.matrix);
    }
  });
  postMesh.castShadow = false; railMesh.castShadow = false;
  scene.add(postMesh, railMesh);
}
function isFreeSpot(x, z, margin) {
  if (Math.abs(x) > Terrain.half - 3 || Math.abs(z) > Terrain.half - 3) return false;
  RoadField.nearest(x, z, _near);
  if (_near.p && _near.d < CONFIG.road.width * 0.5 + margin) return false;
  for (const o of World.obstacles) if (Math.hypot(x - o.x, z - o.z) < o.r + margin) return false;
  for (const f of Terrain.footprints) if (Math.hypot(x - f.x, z - f.z) < f.r + margin * 0.6) return false;
  return true;
}
// Muestreo con rechazo: más denso hacia los bordes del mapa, nunca sobre caminos ni edificios.
function scatter(count, margin, minSpacing, edgeBias) {
  const out = [];
  let tries = 0;
  while (out.length < count && tries < count * 60) {
    tries++;
    const x = rand(-Terrain.half + 4, Terrain.half - 4), z = rand(-Terrain.half + 4, Terrain.half - 4);
    const d = Math.hypot(x, z);
    const accept = edgeBias ? 0.18 + 0.82 * smoothstep(28, 85, d) : 1;
    if (rng() > accept) continue;
    if (!isFreeSpot(x, z, margin)) continue;
    let ok = true;
    for (let i = 0; i < out.length; i++) if (Math.hypot(out[i].x - x, out[i].z - z) < minSpacing) { ok = false; break; }
    if (ok) out.push({ x, z });
  }
  return out;
}

function polyLen(from, pts) {
  let len = 0, px = from.x, pz = from.z;
  for (let i = 0; i < pts.length; i++) { len += Math.hypot(pts[i].x - px, pts[i].z - pz); px = pts[i].x; pz = pts[i].z; }
  return len;
}
function spotIsClear(x, z, margin) {
  for (let i = 0; i < World.obstacles.length; i++) {
    const o = World.obstacles[i];
    if (Math.hypot(x - o.x, z - o.z) < o.r + margin) return false;
  }
  return true;
}

class Mover {
  constructor(group, speed) {
    this.group = group;
    this.pos = group.position;
    this.speed = speed;
    this.heading = 0;
    this.targetHeading = 0;
    this.legs = null;
    this.legIdx = 0;
    this.ptIdx = 0;
    this.node = null;
    this.target = null;
    this.moving = false;
  }
  setNode(id) {
    this.node = id;
    const n = Graph.node(id);
    this.pos.set(n.x, 0, n.z);
  }
  // Ruta = lista de tramos; cada tramo es la polilínea de una arista y el nodo en el que termina.
  // Si el agente está a mitad de arista, decide si conviene seguir o regresar según la tabla Floyd-Warshall.
  routeTo(targetId) {
    const legs = [];
    let startNode = this.node;
    if (this.legs && this.legIdx < this.legs.length) {
      const leg = this.legs[this.legIdx];
      const remaining = leg.pts.slice(this.ptIdx);
      const back = leg.pts.slice(0, this.ptIdx).reverse();
      const fwdLen = polyLen(this.pos, remaining) + Graph.routeDist(leg.node, targetId);
      const backLen = leg.from && back.length ? polyLen(this.pos, back) + Graph.routeDist(leg.from, targetId) : Infinity;
      if (backLen < fwdLen) { legs.push({ pts: back, node: leg.from, from: null }); startNode = leg.from; }
      else { legs.push({ pts: remaining, node: leg.node, from: null }); startNode = leg.node; }
    } else {
      legs.push({ pts: [Graph.node(startNode).pos], node: startNode, from: null });
    }
    const ids = Graph.route(startNode, targetId);
    for (let i = 1; i < ids.length; i++) legs.push({ pts: Graph.poly[ids[i - 1]][ids[i]], node: ids[i], from: ids[i - 1] });
    this.legs = legs;
    this.legIdx = 0;
    this.ptIdx = 0;
    this.target = targetId;
    this.moving = true;
  }
  advance(dt) {
    if (!this.legs || this.legIdx >= this.legs.length) { this.moving = false; this.legs = null; return true; }
    let budget = this.speed * dt;
    while (budget > 0) {
      const leg = this.legs[this.legIdx];
      const p = leg.pts[this.ptIdx];
      const dx = p.x - this.pos.x, dz = p.z - this.pos.z;
      const d = Math.hypot(dx, dz);
      if (d <= budget) {
        this.pos.x = p.x; this.pos.z = p.z;
        budget -= d;
        this.ptIdx++;
        if (this.ptIdx >= leg.pts.length) {
          this.node = leg.node;
          this.legIdx++;
          this.ptIdx = 0;

// Comprobación de proximidad cada pocos frames: doble bucle O(n²) basta para menos de 40 agentes.
function socialCheck() {
  const dist2 = CONFIG.social.distance * CONFIG.social.distance;
  for (let i = 0; i < agents.length; i++) {
    const a = agents[i];
    if (a.state !== STATE.TRAVEL || a.follow || a.removed) continue;
    for (let j = i + 1; j < agents.length; j++) {
      const b = agents[j];
      if (b.state !== STATE.TRAVEL || b.follow || b.removed) continue;
      if (a.pos.distanceToSquared(b.pos) > dist2) continue;
      if (a.socialUntil > Sim.time || b.socialUntil > Sim.time) continue;
      const key = a.id < b.id ? a.id * 10000 + b.id : b.id * 10000 + a.id;
      const until = socialCooldown.get(key);
      if (until !== undefined && until > Sim.time) continue;
      socialCooldown.set(key, Sim.time + rand(CONFIG.social.cooldownMin, CONFIG.social.cooldownMax));
      a.socialUntil = b.socialUntil = Sim.time + CONFIG.social.personalCooldown;
      a.startSocial(b);
      b.startSocial(a);
      break;
    }
  }
}
function spawnTraveler(entryId, opts) {

  a.plan = opts.plan || [
    { node: 'taberna', anchor: World.anchors.taberna, stay: stay * 0.5 },

function spawnPopulation() {
  const homes = ['casa1', 'casa2', 'casa3', 'casa4'];
  const cfg = CONFIG.agents;
  for (let i = 0; i < cfg.agricultor; i++) new Agent('agricultor', i < 2 ? 'granja' : homes[i % 4], { field: i % 2 });
  for (let i = 0; i < cfg.comerciante; i++) new Agent('comerciante', homes[(i + 1) % 4], { stall: World.stalls[i % World.stalls.length] });
  for (let i = 0; i < cfg.minero; i++) new Agent('minero', homes[(i + 2) % 4]);
  const villagers = [];
  for (let i = 0; i < cfg.aldeano; i++) villagers.push(new Agent('aldeano', homes[i % 4]));
  for (let i = 0; i < CONFIG.followers.parejas && i < villagers.length; i++) {
    const leader = villagers[i];
    new Agent('aldeano', leader.home, { follow: leader, followSide: 1 });
  }
  for (let i = 0; i < CONFIG.followers.ninos && i + CONFIG.followers.parejas < villagers.length; i++) {
    const leader = villagers[i + CONFIG.followers.parejas];
    new Agent('nino', leader.home, { follow: leader, scale: 0.62, speedMul: 1.0 });
  }
  for (let i = 0; i < cfg.clerigo; i++) new Agent('clerigo', 'iglesia');
  const circuit = ['castillo', 'plaza', 'taberna', 'casa2', 'plaza', 'mercado', 'almacen', 'mercado', 'casa1', 'plaza', 'iglesia', 'castillo'];
  for (let i = 0; i < cfg.guardia; i++) new Agent('guardia', 'castillo', { circuit, circuitIdx: (i * 5) % circuit.length });
  for (const a of agents) a.pos.y = terrainHeight(a.pos.x, a.pos.z);
}

        this.targetHeading = Math.atan2(dx, dz);
        this.phase += dt * 12;
      }
      u.head.rotation.x = lerp(u.head.rotation.x, 0, Math.min(1, dt * 6));
      u.body.position.y = (this.kind === 'gallina' ? 0.34 : 0.42) + Math.abs(Math.sin(this.phase)) * 0.04;
    } else {
      this.timer -= dt;
      const peck = Math.max(0, Math.sin(Sim.time * 5 + this.phase));
      u.head.rotation.x = peck * 0.6;
      if (this.timer <= 0) {
        if (this.pickTarget()) this.state = 'walk'; else this.timer = rand(0.5, 1.5);
      }
    }
    this.heading += angleDelta(this.heading, this.targetHeading) * Math.min(1, 5 * dt);

}

};
const Rain = { points: null, positions: null, active: 0 };
function initRain() {
  const n = CONFIG.weather.maxDrops, half = CONFIG.weather.rainAreaHalf, h = CONFIG.weather.rainHeight;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    arr[i * 3] = rand(-half, half);
    arr[i * 3 + 1] = rand(0, h);
    arr[i * 3 + 2] = rand(-half, half);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  geo.setDrawRange(0, 0);
  const pts = new THREE.Points(geo, Assets.mat.rain);
  pts.frustumCulled = false;
  pts.visible = false;
  scene.add(pts);
  Rain.points = pts;
  Rain.positions = arr;
}
// Un solo Points con Float32Array reciclado: la gota que cruza el suelo vuelve arriba, nunca se recrea.
function updateRain(dt, targetCount, wind) {
  const goal = Math.round(targetCount);
  if (Rain.active < goal) Rain.active = Math.min(goal, Rain.active + Math.ceil(dt * 2500));
  else if (Rain.active > goal) Rain.active = Math.max(goal, Rain.active - Math.ceil(dt * 2500));
  const pts = Rain.points;
  if (Rain.active <= 0) { pts.visible = false; Assets.mat.rain.opacity = 0; return; }
  pts.visible = true;
  Assets.mat.rain.opacity = Math.min(1, Rain.active / 1800) * 0.7;
  const arr = Rain.positions, half = CONFIG.weather.rainAreaHalf, h = CONFIG.weather.rainHeight;
  const fall = CONFIG.weather.rainSpeed * dt, drift = wind * dt;
  for (let i = 0; i < Rain.active; i++) {
    let y = arr[i * 3 + 1] - fall;
    let x = arr[i * 3] + drift;
    if (y < 0) y += h;
    if (x > half) x -= half * 2;
    arr[i * 3 + 1] = y;
    arr[i * 3] = x;
  }
  pts.geometry.attributes.position.needsUpdate = true;
  pts.geometry.setDrawRange(0, Rain.active);
}
const Weather = {
  state: 'SOLEADO',
  timer: 0,
  cur: { fog: 0, sun: 1, sky: 1, exposure: 1, rain: 0, tint: 0 },
  target: null,
  flash: 0,
  flashSeq: null,
  flashT: 0,
  wind: 4,
  get isStorm() { return this.state === 'TORMENTA'; },
  get isWet() { return this.state === 'LLUVIA' || this.state === 'TORMENTA'; },
  get preset() { return WEATHER_PRESETS[this.state]; },
  init() {
    this.state = chance(0.7) ? 'SOLEADO' : 'NUBLADO';
    this.target = WEATHER_PRESETS[this.state];
    Object.assign(this.cur, { fog: this.target.fog, sun: this.target.sun, sky: this.target.sky, exposure: this.target.exposure, rain: 0, tint: this.target.tint });
    this.timer = rand(CONFIG.weather.minDuration, CONFIG.weather.maxDuration);
    initRain();
  },
  set(next) {
    if (next !== this.state) {
      this.state = next;
      this.target = WEATHER_PRESETS[next];
      this.wind = rand(-6, 6) * (next === 'TORMENTA' ? 2 : 1);
      HUD.log(this.target.msg);
    }
    this.timer = rand(CONFIG.weather.minDuration, CONFIG.weather.maxDuration);
  },
  update(dt) {
    this.timer -= dt;
    if (this.timer <= 0) {
      const row = CONFIG.weather.transitions[this.state];
      this.set(weightedPick(row, null));
    }
    // Transición gradual: aproximación exponencial que llega al 95 % en transitionSeconds.
    const k = 1 - Math.exp(-dt * 3 / CONFIG.weather.transitionSeconds);
    const c = this.cur, t = this.target;
    c.fog += (t.fog - c.fog) * k;
    c.sun += (t.sun - c.sun) * k;
    c.sky += (t.sky - c.sky) * k;
    c.exposure += (t.exposure - c.exposure) * k;
    c.rain += (t.rain - c.rain) * k;
    c.tint += (t.tint - c.tint) * k;
    updateRain(dt, c.rain, this.wind);
    this.updateLightning(dt);
  },
  // Relámpago: dos o tres parpadeos muy breves sobre la luz ambiental, sin geometría extra.
  updateLightning(dt) {
    this.flash = 0;
    if (this.flashSeq) {
      this.flashT += dt;
      let on = false, done = true;
      for (const w of this.flashSeq) {
        if (this.flashT >= w.at && this.flashT < w.at + w.dur) on = true;
        if (this.flashT < w.at + w.dur) done = false;
      }
      this.flash = on ? 1 : 0;
      if (done) this.flashSeq = null;
      return;
    }
    if (this.isStorm && rng() < CONFIG.weather.lightningChancePerSecond * dt) {
      this.flashSeq = chance(0.5)
        ? [{ at: 0, dur: 0.07 }, { at: 0.16, dur: 0.05 }, { at: 0.3, dur: 0.11 }]
        : [{ at: 0, dur: 0.09 }, { at: 0.2, dur: 0.06 }];
      this.flashT = 0;
    }
  }
};

function makeCaravana() {
  const entry = pick(BORDER_NODES);
  const exit = pick(BORDER_NODES.filter(id => id !== entry));
  const stay = rand(CONFIG.events.caravana.stayMin, CONFIG.events.caravana.stayMax);
  const travel = (Graph.routeDist(entry, 'mercado') + Graph.routeDist('mercado', exit)) / CONFIG.speed.cart;
  return {
    node: null, anchor: null,
    duration: travel + stay + 15,
    entry, exit, stay,
    count: randInt(CONFIG.events.caravana.min, CONFIG.events.caravana.max),
    spawned: 0, spawnT: 1.2, cartPhase: 'in', cartTimer: stay,
    wants() { return false; },
    start() {
      const mover = Events.cartMover;
      mover.legs = null;
      mover.setNode(entry);
      mover.pos.y = terrainHeight(mover.pos.x, mover.pos.z);
      mover.routeTo('mercado');
      const first = mover.legs[0].pts[0];
      mover.heading = Math.atan2(first.x - mover.pos.x, first.z - mover.pos.z);
      mover.targetHeading = mover.heading;
      scene.add(World.cart);
      HUD.log(`Una caravana de mercaderes entra por el camino ${Graph.node(entry).label}`);
    },
    update(dt) {
      const mover = Events.cartMover;
      let rolling = false;
      if (this.cartPhase === 'in') {
        rolling = true;
        if (mover.advance(dt)) this.cartPhase = 'wait';
      } else if (this.cartPhase === 'wait') {
        this.cartTimer -= dt;
        if (this.cartTimer <= 0) { this.cartPhase = 'out'; mover.routeTo(this.exit); }
      } else if (this.cartPhase === 'out') {
        rolling = true;
        if (mover.advance(dt)) { this.cartPhase = 'done'; scene.remove(World.cart); }
      }
      if (this.cartPhase !== 'done') {
        mover.updateHeading(dt);
        mover.pos.y = terrainHeight(mover.pos.x, mover.pos.z);
        if (rolling) for (const w of World.cart.userData.wheels) w.rotation.x += dt * CONFIG.speed.cart / 0.6;
      }
      // Los mercaderes salen en fila detrás del carro, uno cada segundo y medio.
      if (this.spawned < this.count) {
        this.spawnT -= dt;
        if (this.spawnT <= 0) {
          const t = spawnTraveler(this.entry, { silent: true, plan: [{ node: 'mercado', stay: this.stay - this.spawned * 1.5 }] });
          t.exitNode = this.exit;
          this.spawned++;
          this.spawnT = 1.5;
        }
      }
    },
    end() {
      if (this.cartPhase !== 'done') scene.remove(World.cart);
      HUD.log('La caravana sigue su camino fuera del valle');
    }
  };
}

// ---------------------------------------------------------------- Ciclo día/noche
const DayCycle = {
  time: 0, hour: CONFIG.startHour, day: 1, phase: 'Amanecer',
  update(dt) {
    this.time += dt;
    const total = CONFIG.startHour + this.time / CONFIG.dayLengthSeconds * 24;
    this.hour = total % 24;
    this.day = Math.floor(total / 24) + 1;
    const h = this.hour;
    this.phase = h >= 5 && h < 7.5 ? 'Amanecer' : h >= 7.5 && h < 18 ? 'Día' : h >= 18 && h < 20.5 ? 'Atardecer' : 'Noche';
  }
};
const SKY_STOPS = [
  [0, SKY.night], [4.5, SKY.night], [6.3, SKY.dawn], [8.5, SKY.day],
  [17, SKY.day], [19, SKY.dusk], [20.8, SKY.night], [24, SKY.night]
];
function skyColorAt(h, out) {
  for (let i = 0; i < SKY_STOPS.length - 1; i++) {
    const a = SKY_STOPS[i], b = SKY_STOPS[i + 1];
    if (h >= a[0] && h <= b[0]) {
      const t = (h - a[0]) / (b[0] - a[0]);
      return out.lerpColors(a[1], b[1], smoothstep(0, 1, t));
    }
  }
  return out.copy(SKY.night);
}
const SUN_WARM = hex(0xFFB070), SUN_WHITE = hex(0xFFF4E0), GREY = hex(0x6E7783), COLD = hex(0x9FB4C8), WHITE = hex(0xFFFFFF);
const GROUND_TINT = hex(PALETTE.grass);
function applyLighting() {
  const h = DayCycle.hour;
  const th = (h / 24) * TAU - Math.PI / 2;
  const cs = Math.cos(th), sn = Math.sin(th);
  sunLight.position.set(cs * 160, sn * 160, 60);
  World.sunMesh.position.set(cs * 520, sn * 520, 200);
  moonLight.position.set(-cs * 160, -sn * 160, -60);
  World.moonMesh.position.set(-cs * 520, -sn * 520, -200);
  const elev = sn;
  const dayF = smoothstep(-0.08, 0.3, elev);
  const nightF = 1 - smoothstep(-0.02, 0.22, elev);
  const w = Weather.cur, flash = Weather.flash;
  sunLight.intensity = 2.8 * dayF * w.sun;
  sunLight.color.lerpColors(SUN_WARM, SUN_WHITE, smoothstep(0, 0.5, elev));
  moonLight.intensity = 0.5 * smoothstep(-0.05, 0.3, -elev) * lerp(0.4, 1, w.sky);
  skyColorAt(h, _c1);
  _c1.lerp(GREY, (1 - w.sky) * 0.85);
  _c1.multiplyScalar(lerp(0.55, 1, w.sky));
  _c1.lerp(COLD, w.tint * 0.35);
  _c1.lerp(WHITE, flash * 0.4);
  scene.background.copy(_c1);
  scene.fog.color.copy(_c1);
  scene.fog.density = w.fog * lerp(1, 1.5, nightF);
  hemiLight.color.copy(_c1);
  hemiLight.groundColor.copy(GROUND_TINT).multiplyScalar(lerp(0.3, 1, dayF));
  hemiLight.intensity = lerp(0.35, 1.4, dayF) * lerp(0.6, 1, w.sky);
  ambientLight.intensity = lerp(0.3, 1.0, dayF) * lerp(0.7, 1, w.sky) + flash * 3.0;
  renderer.toneMappingExposure = lerp(0.72, 1.0, dayF) * w.exposure;
  Assets.mat.window.emissiveIntensity = nightF * 1.7 + (1 - w.sky) * 0.4 * dayF;
  World.sunMesh.visible = elev > -0.2;
  World.moonMesh.visible = elev < 0.2;
  Assets.mat.sun.color.lerpColors(SUN_WARM, hex(0xFFF3C4), smoothstep(0, 0.4, elev));
}

      ['Agricultores', counts.agricultor, ''], ['Comerciantes', counts.comerciante, ''], ['Mineros', counts.minero, ''],
      ['Aldeanos', counts.aldeano, ''], ['Niños', counts.nino, 'optional'], ['Clérigos', counts.clerigo, 'optional'],
      ['Guardias', counts.guardia, ''], ['Viajeros', counts.viajero, ''],
      ['Habitantes', agents.length, 'total'], ['Animales', animals.length, ''],
      ['Refugiados', sheltered, ''], ['Cargas de la mina', Math.round(Events.mineProduction), '']
    ];
    let html = '';
    for (const [k, v, cls] of rows) html += `<span class="k ${cls}">${k}</span><span class="v ${cls}">${v}</span>`;
    e.stats.innerHTML = html;
  }
};

// ---------------------------------------------------------------- Bucle principal
const clock = new THREE.Clock();
let frameCount = 0;
let rafId = 0;
function animate() {
  rafId = requestAnimationFrame(animate);
  const real = Math.min(clock.getDelta(), CONFIG.maxDelta);
  const dt = Sim.paused ? 0 : real * Sim.timeScale;
  if (dt > 0) {
    Sim.time += dt;
    DayCycle.update(dt);
    Weather.update(dt);
    Events.update(dt);
    for (let i = 0; i < agents.length; i++) if (!agents[i].removed) agents[i].update(dt);
    for (let i = agents.length - 1; i >= 0; i--) if (agents[i].removed) agents.splice(i, 1);
    if (frameCount % CONFIG.social.checkEveryFrames === 0) socialCheck();
    for (let i = 0; i < animals.length; i++) animals[i].update(dt);
  }
  applyLighting();
  if (!CameraState.interacting) CameraState.idle += real;
  controls.autoRotate = CameraState.autoEnabled && !CameraState.interacting && CameraState.idle >= CONFIG.camera.resumeAfter;
  controls.update();
  HUD.update(real);
  renderer.render(scene, camera);
  frameCount++;
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(rafId);
    rafId = 0;
  } else if (!rafId) {
    clock.getDelta();
    animate();
  }
});

// ---------------------------------------------------------------- Arranque
function boot() {
  populateScene();
  HUD.init();
  spawnPopulation();
  spawnAnimals();
  Weather.init();
  Events.init();
  applyLighting();
  HUD.log('Amanece sobre Valdecerro');
  document.getElementById('loading').classList.add('hidden');
  if (CONFIG.seed !== null) console.log('Semilla fija:', SEED); else console.log('Semilla de esta partida:', SEED);
  animate();
}
try {
  boot();
} catch (err) {
  document.getElementById('loading').textContent = 'Error al iniciar: ' + err.message;
  throw err;
}
</script>
